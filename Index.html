<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vida Aquática 🌊</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="jogo">

        <h1>🌊 Vida Aquática</h1>

        <p>Ajude a limpar o oceano!</p>

        <div class="informacoes">
            <span>⭐ Pontos: <b id="pontos">0</b></span>
            <span>❤️ Vidas: <b id="vidas">2</b></span>
        </div>

        <div id="oceano">

            <div id="jogador">🛥️</div>

            <div class="lixo lixo1">🗑️</div>
            <div class="lixo lixo2">🥤</div>
            <div class="lixo lixo3">🛍️</div>
            <div class="lixo lixo4">🧹</div>
            <div class="lixo lixo5">🥾</div>
            <div class="lixo lixo6">📰</div>

            <div class="animal animal1">🐠</div>
            <div class="animal animal2">🐢</div>
            <div class="animal animal3">🐡</div>
            <div class="animal animal4">🐙</div>
            <div class="animal animal5">🐳</div>
            <div class="animal animal6">🦈</div>
            <div class="animal animal7">🐬</div>

        </div>

        <p class="instrucoes">
            Use as setas ⬅️ ➡️ ⬆️ ⬇️ para se movimentar.
            <br>
            Pegue o lixo e proteja os animais! 🐢🐠
        </p>

        <button onclick="reiniciarJogo()">🔄 Reiniciar</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
